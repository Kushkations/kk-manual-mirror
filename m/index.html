<!DOCTYPE html>
<html lang="en">
<head>
<!-- covers-refresh-2026-07-28: all 21 property cover collages de-greened + equal-sized -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="theme-color" content="#1e3120">
<title>KushKations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --kk-dark:  #1e3120;
    --kk-mid:   #3d6f42;
    --kk-green: #65bc7b;
    --kk-sand:  #f7f4ee;
    --kk-ink:   #1a1a1a;
    --kk-muted: #6b6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--kk-ink);
    background: var(--kk-sand);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .container {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 18px 40px;
  }

  .top-stripe {
    height: 5px;
    background: linear-gradient(90deg, var(--kk-dark), var(--kk-mid), var(--kk-green));
  }

  .hero-photo {
    width: 100%;
    aspect-ratio: 1020 / 713; /* match the trimmed collage (white cropped off) — box = image ratio */
    object-fit: cover;        /* fills edge-to-edge: no white bars, no crop since ratios match */
    display: block;
    border-radius: 0 0 18px 18px;
    margin-bottom: 0;
  }
  header {
    text-align: center;
    padding: 22px 0 18px;
  }
  header .logo {
    height: 32px;
    width: auto;
    max-width: 180px;
    margin-bottom: 8px;
  }
  header .property {
    display: inline-block;
    white-space: nowrap;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: clamp(13px, calc(4.7vw - 1px), 19px);
    font-weight: 700;
    color: var(--kk-dark);
    line-height: 1.3;
    margin: 10px auto 2px;
    letter-spacing: 0;
  }
  header .property .prop-dash {
    color: var(--kk-dark);
    font-weight: 400;
    padding: 0 4px;
  }
  header .property .prop-tag {
    font-weight: 700;
    color: var(--kk-dark);
  }
  header .address {
    font-size: 14px;
    color: var(--kk-dark);
    margin-top: 12px;
    font-weight: 600;
  }
  header .address a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px dotted var(--kk-mid);
    padding-bottom: 1px;
  }
  /* eyebrow vibe line, REMOVED per user request */
  header .vibe { display: none; }

  .welcome {
    background: white;
    border-radius: 16px;
    padding: 20px 22px;
    margin-bottom: 16px;
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    font-style: normal;
    color: var(--kk-dark);
    line-height: 1.55;
    text-align: center;
    white-space: pre-line;
    box-shadow: 0 2px 10px rgba(30,49,32,0.06);
  }

  /* Welcome Home — owner's note */
  .welcome-note {
    background: #fff;
    border-radius: 16px;
    padding: 24px 20px 20px;
    margin-bottom: 16px;
    box-shadow: 0 3px 14px rgba(30,49,32,0.08);
    border-top: 4px solid var(--kk-green);
  }
  .welcome-note .wn-badge {
    text-align: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0.03em;
    color: var(--kk-dark);
    line-height: 1.1;
  }
  .welcome-note .wn-sub {
    text-align: center;
    font-size: 11px;
    color: var(--kk-mid);
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 6px 0 16px;
  }
  .welcome-note .wn-body { font-size: 14px; line-height: 1.6; color: var(--kk-ink); }
  .welcome-note .wn-body p { margin-bottom: 11px; }
  .welcome-note .wn-body p:last-child { margin-bottom: 0; }
  .welcome-note .wn-sign { font-size: 14px; line-height: 1.5; color: var(--kk-dark); margin-top: 15px; }
  .welcome-note .wn-sign strong { color: var(--kk-mid); }

  .cta-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 18px;
  }
  .cta {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: white;
    padding: 18px 12px;
    border-radius: 14px;
    text-decoration: none;
    color: var(--kk-dark);
    box-shadow: 0 2px 10px rgba(30,49,32,0.06);
    transition: transform 0.15s, box-shadow 0.15s;
    min-height: 92px;
    text-align: center;
  }
  .cta:active { transform: scale(0.97); box-shadow: 0 1px 4px rgba(30,49,32,0.08); }
  .cta .icon {
    font-size: 28px;
    line-height: 1;
  }
  .cta .label {
    font-size: 13px;
    font-weight: 600;
    line-height: 1.25;
  }
  .cta .sub {
    font-size: 10.5px;
    color: var(--kk-muted);
    margin-top: 1px;
  }
  .cta.primary {
    background: var(--kk-dark);
    color: white;
  }
  .cta.primary .sub { color: rgba(255,255,255,0.7); }
  .cta.accent {
    background: var(--kk-green);
    color: white;
  }
  .cta.accent .sub { color: rgba(255,255,255,0.8); }

  section {
    background: white;
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 10px rgba(30,49,32,0.05);
  }
  section h2 {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--kk-mid);
    margin-bottom: 10px;
    font-weight: 700;
    padding-left: 12px;
    position: relative;
  }
  section h2::before {
    content: "";
    position: absolute;
    left: 0;
    top: 2px; bottom: 2px;
    width: 3px;
    background: var(--kk-green);
    border-radius: 2px;
  }

  .wifi-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'SF Mono', Menlo, Consolas, monospace;
    padding: 8px 0;
    border-bottom: 1px solid #f0ede5;
    font-size: 14px;
  }
  .wifi-row:last-child { border-bottom: none; }
  .wifi-row .k { color: var(--kk-muted); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; }
  .wifi-row .v { font-weight: 600; color: var(--kk-dark); }

  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid #f0ede5;
    font-size: 14px;
  }
  .info-row:last-child { border-bottom: none; }
  .info-row .k {
    color: var(--kk-muted);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
    padding-top: 2px;
  }
  .info-row .v {
    font-weight: 600;
    color: var(--kk-dark);
    text-align: right;
    max-width: 65%;
  }

  .full-guide-link {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: white;
    border: 1.5px dashed var(--kk-green);
    padding: 14px 18px;
    border-radius: 12px;
    text-decoration: none;
    color: var(--kk-dark);
    font-weight: 600;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .full-guide-link .arrow {
    color: var(--kk-green);
    font-size: 18px;
  }

  footer {
    text-align: center;
    padding: 18px 0 0;
    color: var(--kk-muted);
    font-size: 11px;
    line-height: 1.5;
  }
  footer .tm {
    margin-top: 6px;
    font-size: 10px;
    opacity: 0.7;
  }

  .loading {
    padding: 60px 0;
    text-align: center;
    color: var(--kk-muted);
  }

  .door-code-card {
    background: linear-gradient(135deg, #1e3120 0%, #3d6f42 100%) !important;
    color: white;
    text-align: center;
    padding: 20px 18px !important;
    border-radius: 16px !important;
  }
  .door-code-card h2 {
    color: white !important;
    border: none !important;
    padding: 0 !important;
    margin-bottom: 8px !important;
    letter-spacing: 0.18em;
  }
  .door-code-value {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    color: white;
    line-height: 1.3;
    margin-bottom: 12px;
    font-weight: 600;
  }
  .door-code-cta {
    display: inline-block;
    background: var(--kk-green);
    color: var(--kk-dark);
    padding: 9px 18px;
    border-radius: 20px;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.06em;
  }
  .door-code-cta:active { transform: scale(0.97); }

  .checkout-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .checkout-list li {
    padding: 8px 0 8px 26px;
    border-bottom: 1px solid #ece8df;
    font-size: 14px;
    color: var(--kk-ink);
    position: relative;
    line-height: 1.45;
  }
  .checkout-list li:last-child { border-bottom: none; }
  .checkout-list li::before {
    content: '✓';
    position: absolute;
    left: 0;
    top: 8px;
    color: var(--kk-green);
    font-weight: 800;
  }

  .guest-greeting {
    text-align: center;
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 30px;
    font-weight: 700;
    color: var(--kk-dark);
    margin-top: 4px;
    margin-bottom: 2px;
    line-height: 1.2;
  }
  .guest-greeting-sub {
    text-align: center;
    font-size: 12.5px;
    color: var(--kk-mid);
    font-weight: 600;
    margin-bottom: 14px;
    line-height: 1.4;
  }
  .tagline {
    text-align: center;
    max-width: 23em;
    margin: 20px auto 18px;
    padding: 0 16px;
  }
  .tagline-brand {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 24px;
    font-weight: 500;
    line-height: 1.34;
    color: var(--kk-dark);
    margin: 0 0 16px;
    letter-spacing: 0.005em;
  }
  .tagline-lead {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: 19px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    line-height: 1.25;
    color: var(--kk-dark);
    margin-bottom: 8px;
  }
  .tagline-sub {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    line-height: 1.5;
    color: #305632;
    max-width: 24em;
    margin: 0 auto;
  }

  .amenity-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  .amenity-card {
    background: white;
    border-radius: 12px;
    padding: 12px;
    box-shadow: 0 2px 8px rgba(30,49,32,0.06);
    text-decoration: none;
    color: var(--kk-dark);
    display: block;
  }
  .amenity-card .title-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 700;
  }
  .amenity-card .body {
    font-size: 12px;
    color: var(--kk-muted);
    line-height: 1.4;
  }
  .amenity-card .icon {
    font-size: 18px;
  }
  .amenity-cards-section[data-empty] { display: none; }

  .nearest-list {
    display: grid;
    gap: 8px;
  }
  .nearest-row {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 12px;
    padding: 8px 0;
    border-bottom: 1px solid #ece8df;
    font-size: 13px;
    line-height: 1.4;
  }
  .nearest-row:last-child { border-bottom: none; }
  .nearest-row .cat {
    color: var(--kk-mid);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
    padding-top: 2px;
  }
  .nearest-row .name {
    color: var(--kk-dark);
    font-weight: 600;
  }
  .nearest-row .addr {
    color: var(--kk-muted);
    font-size: 12px;
    display: block;
    margin-top: 2px;
  }

  .photo-strip {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }
  .photo-strip img {
    width: 100%;
    height: 110px;
    object-fit: cover;
    border-radius: 8px;
    display: block;
  }
  .photo-strip img:last-child:nth-child(odd) {
    grid-column: 1 / -1;
    justify-self: center;
    width: calc((100% - 6px) / 2);
    height: 110px;
  }

  .lang-toggle {
    position: absolute;
    top: 12px;
    right: 14px;
    z-index: 10;
    background: white;
    border: 1px solid var(--kk-green);
    color: var(--kk-dark);
    padding: 5px 12px;
    border-radius: 14px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.06em;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(30,49,32,0.12);
  }
  .lang-toggle:active { transform: scale(0.96); }

  .tut-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid #f0ede5;
    text-decoration: none;
    color: var(--kk-dark);
  }
  .tut-row:last-child { border-bottom: none; }
  .tut-row .t-icon { font-size: 20px; flex: none; }
  .tut-row > span:nth-child(2) { flex: 1; display: flex; flex-direction: column; }
  .tut-row .t-name { font-size: 14px; font-weight: 600; }
  .tut-row .t-sub { font-size: 11.5px; color: var(--kk-muted); margin-top: 1px; }
  .tut-row .arrow { color: var(--kk-green); font-size: 17px; flex: none; }

  details.inst {
    border-bottom: 1px solid #f0ede5;
    padding: 4px 0;
  }
  details.inst:last-child { border-bottom: none; }
  details.inst summary {
    list-style: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--kk-dark);
    padding: 8px 0;
  }
  details.inst summary::-webkit-details-marker { display: none; }
  details.inst summary::after {
    content: '+';
    margin-left: auto;
    color: var(--kk-green);
    font-size: 18px;
    font-weight: 700;
  }
  details.inst[open] summary::after { content: '–'; }
  details.inst .inst-body { padding: 2px 0 12px; }
  .inst-note {
    background: var(--kk-sand);
    border-left: 3px solid var(--kk-green);
    border-radius: 6px;
    padding: 8px 12px;
    font-size: 12.5px;
    line-height: 1.5;
    margin: 8px 0;
    color: var(--kk-dark);
  }
  ol.inst-steps, ul.inst-list {
    margin: 6px 0 0 0;
    padding-left: 20px;
    font-size: 13px;
    line-height: 1.55;
    color: var(--kk-ink);
  }
  ol.inst-steps li, ul.inst-list li { margin-bottom: 6px; }
  .video-btn {
    display: block;
    text-align: center;
    background: var(--kk-dark);
    color: #fff;
    text-decoration: none;
    font-size: 13.5px;
    font-weight: 700;
    padding: 11px 14px;
    border-radius: 10px;
    margin: 10px 0 4px;
  }
  .video-btn:active { transform: scale(0.98); }
  .inst-note.warn {
    background: #fff6e9;
    border-left-color: #c2701f;
  }
  .inst-h {
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--kk-mid);
    margin: 12px 0 2px;
  }
  .access-strip {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    margin-top: 8px;
  }
  .access-strip img {
    width: 100%;
    height: 110px;
    object-fit: cover;
    border-radius: 8px;
    display: block;
  }

  .nearest-row .mins {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--kk-mid);
    background: var(--kk-sand);
    padding: 1px 6px;
    border-radius: 8px;
    margin-left: 4px;
    white-space: nowrap;
  }
  .picks-intro {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 15px;
    font-style: italic;
    color: var(--kk-mid);
    line-height: 1.45;
    margin: -2px 0 12px;
  }
  .pick {
    background: #fff;
    border: 1px solid #efe9dd;
    border-radius: 14px;
    padding: 13px 15px 14px;
    margin-bottom: 11px;
    box-shadow: 0 3px 12px rgba(30,49,32,0.07);
    position: relative;
    overflow: hidden;
  }
  .pick:last-child { margin-bottom: 0; }
  .pick::before {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 4px;
    background: linear-gradient(180deg, var(--kk-green), var(--kk-mid));
  }
  .pick .p-top { display: flex; align-items: center; gap: 11px; }
  .pick .p-txt { display: flex; flex-direction: column; min-width: 0; }
  .pick .p-emoji {
    flex: none;
    width: 42px; height: 42px;
    border-radius: 12px;
    background: linear-gradient(135deg, #eef6ef, #e0efe4);
    display: flex; align-items: center; justify-content: center;
    font-size: 23px;
  }
  .pick .p-name {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--kk-dark);
    line-height: 1.08;
  }
  .pick .p-meta {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--kk-mid);
    font-weight: 800;
    margin-top: 3px;
  }
  .pick .p-body {
    font-size: 12.5px;
    color: var(--kk-ink);
    line-height: 1.5;
    margin-top: 9px;
  }
  .pick .p-order {
    font-size: 12.5px;
    line-height: 1.45;
    margin-top: 9px;
    padding: 9px 12px;
    background: linear-gradient(135deg, #f2f8f3, #e6f2ea);
    border-radius: 10px;
    color: var(--kk-dark);
  }
  .pick .p-order b { font-weight: 800; color: var(--kk-mid); }

  /* Collapsible sections (tap the heading to open/close) */
  .collapsible > h2 { cursor: pointer; padding-right: 26px; user-select: none; }
  .collapsible > h2::after {
    content: '+';
    position: absolute;
    right: 0; top: -1px;
    color: var(--kk-green);
    font-size: 20px;
    font-weight: 700;
    line-height: 1;
  }
  .collapsible:not(.collapsed) > h2::after { content: '–'; }
  .collapsible.collapsed .sec-collapse { display: none; }

  /* Explore & Help hub, CTA-style tiles that reveal their content below the grid */
  .hub-section .cta-grid { margin-bottom: 0; }
  .hub-tile { border: none; font-family: inherit; width: 100%; }
  .hub-tile.active { background: var(--kk-dark); color: #fff; }
  .hub-tile.active .sub { color: rgba(255,255,255,0.72); }
  .hub-content { margin-top: 14px; }

  /* Sticky jump / tab navigation */
  .tab-nav-wrap {
    position: sticky;
    top: 0;
    z-index: 20;
    margin: 0 0 14px;
    background: rgba(247,244,238,0.94);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .tab-nav {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 9px 2px;
  }
  /* soft fade hints that the row continues under the arrows */
  .tab-nav-wrap::before, .tab-nav-wrap::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 40px;
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transition: opacity 0.15s;
  }
  .tab-nav-wrap::before { left: 0; background: linear-gradient(90deg, rgba(247,244,238,0.96), rgba(247,244,238,0)); }
  .tab-nav-wrap::after  { right: 0; background: linear-gradient(270deg, rgba(247,244,238,0.96), rgba(247,244,238,0)); }
  .tab-nav-wrap.more-left::before  { opacity: 1; }
  .tab-nav-wrap.more-right::after  { opacity: 1; }
  .tab-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 30px; height: 30px;
    border-radius: 50%;
    border: 1px solid #e2ddd1;
    background: #fff;
    color: var(--kk-dark);
    font-size: 20px;
    font-weight: 700;
    line-height: 26px;
    text-align: center;
    padding: 0;
    cursor: pointer;
    box-shadow: 0 2px 7px rgba(30,49,32,0.28);
    z-index: 3;
  }
  .tab-arrow:active { transform: translateY(-50%) scale(0.9); }
  .tab-arrow-left  { left: 3px; }
  .tab-arrow-right { right: 3px; }

    background: var(--kk-dark);

  }
  section[id^="sec-"] { scroll-margin-top: 58px; }

  /* Detailed house rules */
  .rules-list { display: grid; gap: 13px; }
  .rule { padding-left: 30px; position: relative; }
  .rule .r-num {
    position: absolute;
    left: 0; top: 1px;

    background: var(--kk-green);
    color: white;
    border-radius: 50%;

    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .rule .r-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--kk-dark);
    line-height: 1.3;
  }
  .rule .r-body {
    font-size: 12.5px;
    color: var(--kk-muted);
    line-height: 1.5;
    margin-top: 2px;
  }

  /* Need Anything / help block */
  .help-line {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 0;
    border-bottom: 1px solid #f0ede5;
    font-size: 13.5px;
    color: var(--kk-dark);
    text-decoration: none;

  .help-line > span:nth-child(2) { flex: 1; display: flex; flex-direction: column; }
  .help-line .h-main { font-weight: 700; line-height: 1.3; }
  .help-line .h-sub { font-size: 11.5px; color: var(--kk-muted); margin-top: 1px; }
  .help-line .arrow { color: var(--kk-green); font-weight: 700; font-size: 17px; flex: none; }

  /* Big "Save 10%" banner at the bottom */
  .save-banner {
    display: block;
    text-align: center;
    background: linear-gradient(135deg, var(--kk-mid) 0%, var(--kk-green) 100%);
    color: #fff;
    text-decoration: none;
    border-radius: 18px;
    padding: 28px 22px;
    margin: 6px 0 16px;
    box-shadow: 0 6px 20px rgba(61,111,66,0.30);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .save-banner:active { transform: scale(0.98); box-shadow: 0 2px 8px rgba(61,111,66,0.25); }
  .save-banner .sb-icon { font-size: 44px; line-height: 1; margin-bottom: 6px; }
  .save-banner .sb-title {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-size: 28px;
    font-weight: 700;
    line-height: 1.15;
    letter-spacing: 0.01em;
  }
  .save-banner .sb-sub { font-size: 13px; margin-top: 9px; font-weight: 600; opacity: 0.95; }
  /* YouTube-style tutorial video picker */
  .vid-list { display: grid; gap: 13px; }
  .vid-card { display: flex; gap: 12px; text-decoration: none; color: var(--kk-dark); }
  .vid-card:active { opacity: 0.85; }
  .vid-thumb {
    position: relative; flex: none;
    width: 140px; aspect-ratio: 16 / 9;
    border-radius: 10px; overflow: hidden;
    background: linear-gradient(135deg, var(--kk-dark), var(--kk-mid));
    background-size: cover; background-position: center;
    display: flex; align-items: center; justify-content: center;
  }
  .vid-thumb .vid-emoji { position: absolute; font-size: 50px; opacity: 0.32; }
  .vid-play {
    position: absolute;
    width: 40px; height: 28px;
    border-radius: 7px;
    background: #ff0000; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; padding-left: 2px;
    box-shadow: 0 1px 5px rgba(0,0,0,0.35);
  }
  .vid-info { flex: 1; min-width: 0; align-self: center; }
  .vid-title { font-size: 13.5px; font-weight: 700; line-height: 1.32; color: var(--kk-dark); }
  .vid-chan { font-size: 11.5px; color: var(--kk-muted); margin-top: 4px; }

  /* Early / Late fees, two side-by-side columns for easy comparison */
  .fee-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fee-col { border: 1px solid #ece5d6; border-radius: 12px; overflow: hidden; }
  .fee-head { padding: 11px 8px 10px; text-align: center; }
  .fee-col.early .fee-head { background: linear-gradient(135deg, #eef6ef, #dfeee4); }
  .fee-col.late .fee-head { background: linear-gradient(135deg, #f4efe4, #eae1cf); }
  .fee-ic { font-size: 24px; line-height: 1; display: block; }
  .fee-title { font-size: 13px; font-weight: 800; color: var(--kk-dark); display: block; margin-top: 4px; line-height: 1.15; }
  .fee-note { font-size: 10px; color: var(--kk-mid); font-weight: 700; display: block; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.04em; }
  .fee-item { padding: 9px 6px; text-align: center; border-top: 1px solid #f2efe7; }
  .fee-when { display: block; font-size: 12px; color: var(--kk-muted); }
  .fee-amt { display: block; font-size: 16px; font-weight: 800; color: var(--kk-dark); margin-top: 2px; }

  /* WiFi card */
  .wifi-card { display: flex; align-items: center; gap: 13px; background: linear-gradient(135deg, #eef6ef, #e0efe4); border-radius: 12px; padding: 14px 16px; }
  .wifi-ic { font-size: 30px; flex: none; }
  .wifi-lines { flex: 1; min-width: 0; display: grid; gap: 8px; }
  .wifi-line { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; border-bottom: 1px solid rgba(61,111,66,0.16); padding-bottom: 7px; }
  .wifi-line:last-child { border-bottom: none; padding-bottom: 0; }
  .wifi-k { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--kk-mid); font-weight: 700; }
  .wifi-val { font-family: 'SF Mono', Menlo, Consolas, monospace; font-size: 14.5px; font-weight: 700; color: var(--kk-dark); text-align: right; word-break: break-all; }

  /* The Basics — arrival/departure stat cards + icon rows */
  .basics-times { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .btime { border: 1px solid #ece5d6; border-radius: 12px; padding: 12px 8px; text-align: center; }
  .bt-ic { font-size: 22px; display: block; }
  .bt-lbl { font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--kk-mid); font-weight: 700; display: block; margin-top: 4px; }
  .bt-val { font-size: 17px; font-weight: 800; color: var(--kk-dark); display: block; margin-top: 2px; }
  .binfo { display: flex; align-items: flex-start; gap: 11px; padding: 10px 0; border-bottom: 1px solid #f0ede5; }
  .binfo:last-of-type { border-bottom: none; }
  .bi-ic { font-size: 19px; flex: none; margin-top: 1px; }
  .bi-txt { display: flex; flex-direction: column; min-width: 0; }
  .bi-k { font-size: 11px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--kk-mid); font-weight: 700; }
  .bi-v { font-size: 13.5px; color: var(--kk-dark); font-weight: 600; margin-top: 2px; line-height: 1.4; }

  /* Cannabis-Friendly — status pills */
  .cann-row { display: flex; align-items: center; gap: 11px; padding: 11px 0; border-bottom: 1px solid #f0ede5; }
  .cann-row:last-child { border-bottom: none; }
  .cann-ic { font-size: 20px; flex: none; }
  .cann-lbl { flex: 1; font-size: 14px; font-weight: 600; color: var(--kk-dark); }
  .cann-pill { font-size: 11px; font-weight: 800; padding: 4px 11px; border-radius: 20px; white-space: nowrap; }
  .cann-pill.yes { background: #e3f2e7; color: #2b7a3f; }
  .cann-pill.no { background: #fbe7e7; color: #c0392b; }
  .cann-pill.warn { background: #fdf1e3; color: #b9701f; font-size: 10.5px; white-space: normal; text-align: right; max-width: 46%; }

  /* Checkout instructions — icon-tile checklist */
  .co-list { display: grid; gap: 9px; }
  .co-item { display: flex; align-items: center; gap: 12px; padding: 11px 13px; background: linear-gradient(135deg, #f3f8f4, #eaf3ec); border-radius: 12px; }
  .co-ic { flex: none; width: 36px; height: 36px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 18px; box-shadow: 0 1px 4px rgba(30,49,32,0.12); }
  .co-txt { font-size: 13.5px; color: var(--kk-dark); font-weight: 600; line-height: 1.35; }

  /* =====================================================================
     PALACE V2 — scoped redesign. EVERY rule is prefixed body.palace-v2 so
     it can ONLY affect the Palace property (?p=palace). The other 20
     properties never get the class and render exactly as before.
     Fonts: Montserrat (headers/accent) · Inter (body + codes). No cursive.
     ===================================================================== */
  body.palace-v2 { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; --pv-shadow: 0 4px 16px rgba(30,49,32,0.09); }
  body.palace-v2 .welcome, body.palace-v2 .wn-body, body.palace-v2 .r-body,
  body.palace-v2 .bi-v, body.palace-v2 .p-body, body.palace-v2 .co-txt,
  body.palace-v2 .help-line, body.palace-v2 .address { font-family: 'Inter', sans-serif; }
  body.palace-v2 section h2, body.palace-v2 .property, body.palace-v2 .prop-tag,
  body.palace-v2 .tagline-lead, body.palace-v2 .sb-title, body.palace-v2 .r-title,
  body.palace-v2 .fee-title, body.palace-v2 .bt-val, body.palace-v2 .cta .label,
  body.palace-v2 .tab-btn { font-family: 'Montserrat', sans-serif; }

  /* inline line-icons (Lucide-style, consistent 2px stroke) */
  body.palace-v2 .kk-icon { display: inline-flex; align-items: center; justify-content: center; line-height: 0; }
  body.palace-v2 .kk-icon svg, body.palace-v2 .copy-btn svg,
  body.palace-v2 .wifi-ic svg, body.palace-v2 .cta .icon svg,
  body.palace-v2 .help-line .h-ic svg, body.palace-v2 .sb-icon svg,
  body.palace-v2 .pv2-count svg {
    width: 1em; height: 1em; stroke: currentColor; stroke-width: 2;
    fill: none; stroke-linecap: round; stroke-linejoin: round;
  }

  body.palace-v2 header { padding: 20px 0 8px; }

    font-weight: 800; font-size: clamp(20px, 6vw, 26px);

  body.palace-v2 .door-code-copy-row { display: flex; justify-content: center; margin: 0 0 12px; }

  /* copy button — shared (door code · wifi · coupon) */
  body.palace-v2 .copy-btn {

  body.palace-v2 .wifi-val-row .copy-btn { background: var(--kk-dark); color: #fff; padding: 5px; font-size: 11px; flex: none; }

  body.palace-v2 .sb-icon { font-size: 40px; color: #fff; }

  body.palace-v2 .vid-list {

    -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 4px; margin: 0 -2px;
  }
  body.palace-v2 .vid-list::-webkit-scrollbar { display: none; }
  body.palace-v2 .vid-card {
    flex: 0 0 76%; max-width: 250px; flex-direction: column; scroll-snap-align: start;

  body.palace-v2 .photo-strip.pv2-banner { display: block; position: relative; border-radius: 14px; overflow: hidden; }
  body.palace-v2 .photo-strip.pv2-banner img { width: 100%; height: 150px; object-fit: cover; border-radius: 14px; }
  body.palace-v2 .photo-strip.pv2-banner .pv2-count {
    position: absolute; right: 10px; bottom: 10px; background: rgba(30,49,32,0.82); color: #fff;
    font-size: 11.5px; font-weight: 700; padding: 5px 12px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
  }
  body.palace-v2 .pv2-count svg { width: 14px; height: 14px; }
  body.palace-v2 .photo-strip.pv2-banner { cursor: pointer; }

  /* Full-screen photo gallery (opens when the banner is tapped) */
  body.palace-v2 .pv2-lightbox { position: fixed; inset: 0; z-index: 1000; background: rgba(12,16,13,0.95); display: none; }
  body.palace-v2 .pv2-lightbox.open { display: flex; }
  body.palace-v2 .pv2-lb-track {
    flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory;

  body.palace-v2 .pv2-lb-slide { flex: 0 0 100%; scroll-snap-align: center; display: flex; align-items: center; justify-content: center; padding: 20px 14px; }
  body.palace-v2 .pv2-lb-slide img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 10px; }
  body.palace-v2 .pv2-lb-close {

  }
  body.palace-v2 .pv2-lb-close svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }
  body.palace-v2 .pv2-lb-count {
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%); z-index: 3; color: #fff;

  }
  body.palace-v2 .pv2-lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 44px; height: 44px; border-radius: 50%;

  }
  body.palace-v2 .pv2-lb-nav svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  body.palace-v2 .pv2-lb-next { right: 10px; }

  body.palace-v2 .r-title { font-weight: 800; }
  body.palace-v2 .fine-badge {
    display: inline-block; background: #fbe6cd; color: #93540f; font-weight: 800; font-size: 12px;

  }

  body.palace-v2 .cann-pill.yes { background: #d2edd9; color: #185c28; border-color: #97d1a6; }
  body.palace-v2 .cann-pill.no { background: #fad7d7; color: #97281c; border-color: #eeaba6; }
  body.palace-v2 .cann-pill.warn { background: #fbe2c4; color: #854b0d; border-color: #eabf87; }

  body.palace-v2 .save-banner .sb-title { font-weight: 800; letter-spacing: -0.01em; }
  body.palace-v2 .coupon-pill {

  body.palace-v2 .coupon-pill .copy-btn { background: var(--kk-dark); color: #fff; }

  body.palace-v2 .tab-btn { font-weight: 700; }
  body.palace-v2 .tab-nav .tab-btn.active { background: var(--kk-mid); border-color: var(--kk-mid); }

  body.palace-v2 .bt-ic svg { width: 22px; height: 22px; }
  body.palace-v2 .bi-ic { color: var(--kk-mid); }
  body.palace-v2 .bi-ic svg { width: 19px; height: 19px; vertical-align: middle; }
  body.palace-v2 .cann-ic { color: var(--kk-mid); display: inline-flex; align-items: center; }
  body.palace-v2 .cann-ic svg { width: 20px; height: 20px; }
  body.palace-v2 .fee-ic { color: var(--kk-mid); }
  body.palace-v2 .fee-ic svg { width: 22px; height: 22px; }
  body.palace-v2 .co-ic { color: var(--kk-mid); }
  body.palace-v2 .co-ic svg { width: 18px; height: 18px; }
  body.palace-v2 .amenity-acc summary .kk-icon { color: var(--kk-mid); font-size: 18px; flex: none; }
  body.palace-v2 .tab-btn { display: inline-flex; align-items: center; gap: 6px; }
  body.palace-v2 .tab-btn .kk-icon { font-size: 14px; flex: none; }

  /* (refinement 1) Cannabis: title + subtle subtext, uniform pills */
  body.palace-v2 .cann-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  body.palace-v2 .cann-txt .cann-lbl { flex: none; }
  body.palace-v2 .cann-sub { font-size: 11px; color: var(--kk-muted); font-weight: 500; line-height: 1.3; }

  /* (refinement 2) Early/Late pricing accordion */
  body.palace-v2 .fee-accordion { border: 1px solid #ece5d6; border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
  body.palace-v2 .fee-accordion summary {
    list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 15px; font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; color: var(--kk-dark);
  }
  body.palace-v2 .fee-accordion summary::-webkit-details-marker { display: none; }
  body.palace-v2 .fee-accordion summary::after { content: '+'; color: var(--kk-green); font-size: 20px; font-weight: 700; line-height: 1; }
  body.palace-v2 .fee-accordion[open] summary::after { content: '–'; }
  body.palace-v2 .fee-accordion .fee-cols { padding: 0 13px 14px; }

  /* (refinement 3) Quick Instructions: hint + larger tap target on each row */
  body.palace-v2 .amen-hint { font-size: 11px; color: var(--kk-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin: -4px 0 8px; }
  body.palace-v2 .amenity-acc summary { padding-top: 12px; padding-bottom: 12px; }
</style>
</head>
<body>
<div class="top-stripe"></div>
<button class="lang-toggle" id="langToggle">EN | ES</button>
<div class="container">
  <div id="app"><div class="loading">Loading…</div></div>
</div>

<template id="tpl">
  <img class="hero-photo" data-bind-src="meta.cover_photo" alt="">
  <header>
    <img class="logo" src="../assets/kk-logo.png" alt="KushKations">
    <div class="property"><span class="prop-name" data-bind="meta.name"></span> <span class="prop-dash">—</span> <span class="prop-tag">Where memories won't be forgotten.</span></div>
    <div class="address"><a data-bind-href="map_link" data-bind="meta.address" target="_blank" rel="noopener"></a></div>
  </header>

  <div class="tagline">
    <div class="tagline-lead">Your reset starts now.</div>
    <div class="tagline-sub">Step inside, leave the noise behind, and enjoy every moment of your stay.</div>
  </div>

  <div class="guest-greeting" data-bind="guest_greeting"></div>
  <div class="guest-greeting-sub" data-bind="guest_greeting_sub"></div>

  <div class="welcome" data-bind="welcome_line"></div>

  <section class="door-code-card">
    <h2>Door Code</h2>

    <a class="door-code-cta" data-bind-href="sms_door_link">Need it now? Text us →</a>
  </section>

  <div class="cta-grid">
    <a class="cta primary" data-bind-href="sms_link">
      <div class="icon">💬</div>
      <div class="label">Text Us</div>
      <div class="sub">Quick reply, anytime</div>
    </a>
    <a class="cta primary" data-bind-href="tel_link">
      <div class="icon">📞</div>
      <div class="label">Call Us</div>
      <div class="sub">Tap to call anytime</div>
    </a>
    <a class="cta accent" data-bind-href="sms_extension_link">
      <div class="icon">⏰</div>
      <div class="label">Early/Late Checkout</div>
      <div class="sub">Request via text</div>
    </a>
    <a class="cta" data-bind-href="report_link">
      <div class="icon">⚠️</div>
      <div class="label">Report an Issue</div>
      <div class="sub">Send a photo + note</div>
    </a>
  </div>

  <div class="tab-nav-wrap">
    <button class="tab-arrow tab-arrow-left" id="tabArrowLeft" type="button" aria-label="Scroll tabs left" hidden>‹</button>
    <nav id="tabNav" class="tab-nav" aria-label="Jump to a section"></nav>
    <button class="tab-arrow tab-arrow-right" id="tabArrowRight" type="button" aria-label="Scroll tabs right" hidden>›</button>
  </div>

  <section>
    <h2>WiFi</h2>
    <div class="wifi-card">
      <span class="wifi-ic">📶</span>
      <span class="wifi-lines">
        <span class="wifi-line"><span class="wifi-k">Network</span><span class="wifi-val" data-bind="wifi.network"></span></span>
        <span class="wifi-line"><span class="wifi-k">Password</span><span class="wifi-val" data-bind="wifi.password"></span></span>
      </span>
    </div>
  </section>

  <section>
    <h2>House Rules</h2>
    <div class="rules-list">
      <div class="rule"><span class="r-num">1</span><div class="r-title">No Tobacco Indoors</div><div class="r-body">Cigarettes &amp; cigars outside only, no littering (fine). Vapes, blunt wraps &amp; marijuana are fine inside.</div></div>
      <div class="rule"><span class="r-num">2</span><div class="r-title">No Parties or Extra Guests</div><div class="r-body">Any unapproved party or extra guest ends your reservation immediately.</div></div>
      <div class="rule"><span class="r-num">3</span><div class="r-title">Quiet Hours · 10 PM to 9 AM</div><div class="r-body">Neighbor or police complaints may end your reservation.</div></div>
      <div class="rule"><span class="r-num">4</span><div class="r-title">Pets Welcome</div><div class="r-body">Clean up after them, up to a $150 fine for waste left behind.</div></div>
      <div class="rule"><span class="r-num">5</span><div class="r-title">No Late Checkouts</div><div class="r-body">$50 per 15 min past 10 AM. Ask 24 hours ahead for more time.</div></div>
      <div class="rule"><span class="r-num">6</span><div class="r-title">Dispose of Ash Properly</div><div class="r-body">$50 fine, never ash in the hot tub or on furniture.</div></div>
    </div>
  </section>

  <section>
    <h2>The Basics</h2>
    <div class="basics-times">
      <div class="btime"><span class="bt-ic">🕓</span><span class="bt-lbl">Check-in</span><span class="bt-val" data-bind="arrival.check_in_time"></span></div>
      <div class="btime"><span class="bt-ic">🕙</span><span class="bt-lbl">Check-out</span><span class="bt-val" data-bind="checkout.time"></span></div>
    </div>
    <div class="binfo"><span class="bi-ic">🗑️</span><span class="bi-txt"><span class="bi-k">Trash</span><span class="bi-v" data-bind="checkout.trash_day"></span></span></div>
    <div class="binfo"><span class="bi-ic">🅿️</span><span class="bi-txt"><span class="bi-k">Parking</span><span class="bi-v" data-bind="arrival.parking"></span></span></div>
    <img data-bind-src="arrival.parking_photo" style="width:100%;border-radius:10px;margin-top:10px;display:block;" alt="Parking">
    <img data-bind-src="checkout.trash_photo" style="width:100%;border-radius:10px;margin-top:10px;display:block;" alt="Trash bins">
  </section>

  <section>
    <h2>Cannabis-Friendly</h2>
    <div class="cann-row"><span class="cann-ic">🌿</span><span class="cann-lbl">Indoor 420</span><span class="cann-pill yes">Allowed</span></div>
    <div class="cann-row"><span class="cann-ic">🚭</span><span class="cann-lbl">Indoor Tobacco</span><span class="cann-pill no">Not allowed</span></div>
    <div class="cann-row"><span class="cann-ic">🚬</span><span class="cann-lbl">Tobacco Outside</span><span class="cann-pill warn">Allowed, but littering is NOT</span></div>
  </section>

  <section>
    <h2>Early Check-In &amp; Late Checkout</h2>
    <div class="fee-cols">
      <div class="fee-col early">
        <div class="fee-head"><span class="fee-ic">🌅</span><span class="fee-title">Early Check-In</span><span class="fee-note">Check-in 4 PM</span></div>
        <div class="fee-item"><span class="fee-when">Before 10 AM</span><span class="fee-amt">$125</span></div>
        <div class="fee-item"><span class="fee-when">Before noon</span><span class="fee-amt">$75</span></div>
        <div class="fee-item"><span class="fee-when">Before 2 PM</span><span class="fee-amt">$50</span></div>
      </div>
      <div class="fee-col late">
        <div class="fee-head"><span class="fee-ic">🌙</span><span class="fee-title">Late Checkout</span><span class="fee-note">Checkout 10 AM</span></div>
        <div class="fee-item"><span class="fee-when">Until 12 PM</span><span class="fee-amt">$50</span></div>
        <div class="fee-item"><span class="fee-when">Until 2 PM</span><span class="fee-amt">$100</span></div>
        <div class="fee-item"><span class="fee-when">After 2 PM</span><span class="fee-amt">Extra night</span></div>
      </div>
    </div>
    <div class="inst-note">Subject to availability and the cleaning schedule, text us to lock it in.</div>
    <a class="door-code-cta" data-bind-href="sms_extension_link" style="display:block;text-align:center;margin-top:10px;">Request via text →</a>
  </section>

  <section>
    <h2>Checkout Instructions</h2>
    <div class="co-list">
      <div class="co-item"><span class="co-ic">🧺</span><span class="co-txt">Place dirty towels and rags in the bathtub</span></div>
      <div class="co-item"><span class="co-ic">💡</span><span class="co-txt">Turn off all lights</span></div>
      <div class="co-item"><span class="co-ic">🍽️</span><span class="co-txt">Load any used dishes in the dishwasher</span></div>
      <div class="co-item"><span class="co-ic">🗑️</span><span class="co-txt">Take all trash to the outside bins</span></div>
      <div class="co-item"><span class="co-ic">📺</span><span class="co-txt">Return TV remotes to the holder</span></div>
      <div class="co-item"><span class="co-ic">🥫</span><span class="co-txt">Leave any unopened food on the counter (donated to the cleaning team)</span></div>
      <div class="co-item"><span class="co-ic">🛏️</span><span class="co-txt">No need to strip the beds, our team handles it</span></div>
    </div>
  </section>

  <section class="amenity-cards-section" data-amenity-cards>
    <h2>Quick Instructions</h2>
    <div class="amenity-acc"></div>
  </section>

  <section>
    <h2>Tutorials &amp; How-Tos</h2>
    <div class="vid-list"></div>
  </section>

  <section data-section="picks" style="display:none;">
    <h2>Host Picks</h2>
    <p class="picks-intro">Personal favorites from your host, the spots he actually eats at, and the orders he stands behind.</p>
    <div class="picks-list"></div>
  </section>

  <section data-section="getaround" style="display:none;">
    <h2>Getting Around</h2>
    <div class="ga-list"></div>
    <div class="inst-note">Uber &amp; Lyft are quick and reliable here. Easy highway access, and RTD transit stops are listed under What's Nearest.</div>
  </section>

  <section data-section="nearest">
    <h2>What's Nearest</h2>
    <div class="nearest-list"></div>
  </section>

  <section>
    <h2>Photos</h2>
    <div class="photo-strip"></div>
  </section>

  <section>
    <h2>Need Anything?</h2>
    <a class="help-line" data-bind-href="tel_link"><span class="h-ic">📞</span><span><span class="h-main" data-bind="text_line_display"></span><span class="h-sub">Call or text us anytime, we reply fast</span></span><span class="arrow">→</span></a>
    <a class="help-line" data-bind-href="report_link"><span class="h-ic">⚠️</span><span><span class="h-main">Report an issue</span><span class="h-sub">Send a photo and a quick note</span></span><span class="arrow">→</span></a>
    <a class="help-line" data-bind-href="save10_link" target="_blank" rel="noopener"><span class="h-ic">🎁</span><span><span class="h-main">Book direct &amp; save 10%</span><span class="h-sub">Code STAYNSAVE10 at kushkations.com</span></span><span class="arrow">→</span></a>
  </section>

  <section>
    <h2>Emergency</h2>
    <div class="info-row"><div class="k">Hospital</div><div class="v" data-bind="emergency.nearest_hospital.name"></div></div>
    <div class="info-row"><div class="k">Address</div><div class="v" data-bind="emergency.nearest_hospital.address"></div></div>
    <div class="info-row"><div class="k">Police (non-emergency)</div><div class="v" data-bind="emergency.non_emergency_police"></div></div>
  </section>

  <a class="save-banner" data-bind-href="save10_link" target="_blank" rel="noopener">
    <div class="sb-icon">🎁</div>
    <div class="sb-title">Save 10% on your next stay</div>
    <div class="sb-sub">Book direct at kushkations.com · Code STAYNSAVE10</div>
  </a>

  <footer>
    KushKations<sup>™</sup> · Come enjoy a KushKation!<br>
    <div class="tm">This page refreshes automatically when we update it.</div>
  </footer>
</template>

<script>
(async function () {
  const params = new URLSearchParams(location.search);
  let slug = params.get('p');
  if (!slug) {
    const m = location.pathname.match(/\/m\/([a-z0-9-]+)\/?$/i);
    if (m) slug = m[1];
  }
  slug = slug || 'palace';

  let data;
  try {
    const res = await fetch(`../content/properties/${slug}.json`, { cache: 'no-store' });
    data = await res.json();
  } catch (e) {
    document.getElementById('app').innerHTML =
      `<p style="padding:40px 16px;color:#b00;">Couldn't load ${slug}.json</p>`;
    return;
  }

  // Pull current guest from OwnerRez (live, every page load)
  let live = null;
  try {
    const r = await fetch(`/api/current-guest?p=${slug}`, { cache: 'no-store' });
    if (r.ok) live = await r.json();
  } catch (_) {}

  // Guest personalization: URL ?guest=Name overrides; otherwise use OR
  let guestName = params.get('guest') || (live && live.guest && live.guest.first_name) || '';
  data.guest_greeting = guestName ? `Hi ${guestName}! 👋` : '';
  data.guest_greeting_sub = guestName ? `This guide is set up just for your stay at ${data.meta.name}.` : '';
  if (live && live.door_code) {
    data.door_code_display = live.door_code;
  } else if (live && live.code_gate === 'withheld') {
    // Requirements not yet complete — withhold the code, tell them what to finish.
    data.door_code_display = 'Complete your pre-arrival requirements to unlock your door code: sign the lease agreement and finish identity verification.';
  } else if (live && live.door_code_available_on) {
    data.door_code_display = `Available ${live.door_code_available_on}`;
  }

  // Derived fields
  const phone = (data.emergency && data.emergency.text_line_override) || '+1 (303) 731-6880';
  const phoneDigits = phone.replace(/\D/g, '');
  const guestPrefix = guestName ? `Hi, this is ${guestName}.` : 'Hi,';
  data.sms_link = `sms:+${phoneDigits}?body=${encodeURIComponent(`${guestPrefix} I'm staying at ${data.meta.name}.`)}`;
  data.sms_door_link = `sms:+${phoneDigits}?body=${encodeURIComponent(`${guestPrefix} I'm checking into ${data.meta.name} and need the door code please.`)}`;
  data.sms_extension_link = `sms:+${phoneDigits}?body=${encodeURIComponent(`${guestPrefix} I'm staying at ${data.meta.name}. Can I request an early check-in or late checkout? Happy to pay the fee.`)}`;
  data.report_link = `sms:+${phoneDigits}?body=${encodeURIComponent(`${guestPrefix} I'm reporting an issue at ${data.meta.name}: `)}`;
  data.ig_link = 'https://instagram.com/kushkations';
  data.review_link = `mailto:info@kushkations.com?subject=${encodeURIComponent(`Review, ${data.meta.name}`)}&body=${encodeURIComponent('Hi! Here is my review:\n\n\n[Your name, dates of stay]')}`;
  data.save10_link = 'https://kushkations.com';
  data.tel_link = `tel:+${phoneDigits}`;
  data.text_line_display = phone;
  data.welcome_line = `Welcome in! We've gathered your door code, Wi-Fi details, house instructions, and favorite local eats right here so you can settle in effortlessly.\n\nIf you need anything at all, just shoot us a message. We're more than willing to help ANYTIME!`;
  data.map_link = data.meta.address
    ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(data.meta.address)}`
    : '';
  // Door code: placeholder for now. Backend wiring (OwnerRez/ChargeAutomation lookup) to come.
  data.door_code_display = data.door_code_display || 'Sent via text 24 hours before check-in';

  const get = (path) =>
    path.split('.').reduce((o, k) => (o == null ? undefined : o[k]), data);

  const tpl = document.getElementById('tpl');
  const node = tpl.content.cloneNode(true);

  node.querySelectorAll('[data-bind]').forEach(el => {
    const v = get(el.getAttribute('data-bind'));
    if (v == null || v === '') { el.remove(); return; }
    el.textContent = String(v);
  });

  node.querySelectorAll('[data-bind-src]').forEach(el => {
    const v = get(el.getAttribute('data-bind-src'));
    if (!v) { el.remove(); return; }
    el.setAttribute('src', v);
  });

  node.querySelectorAll('[data-bind-href]').forEach(el => {
    const v = get(el.getAttribute('data-bind-href'));
    if (!v) { el.remove(); return; }
    el.setAttribute('href', v);
  });

  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(node);

  // Amenity instructions, one tap-to-expand accordion (each amenity reveals its full steps)
  const esc = (t) => String(t).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const AM = data.amenities || {};

  // Amenity tutorial videos, central so the same clip serves every property.
  // Add a URL here and a "Watch the video" button appears in that amenity's panel.
  const AMENITY_VIDEOS = {
    ps5:       {url: 'https://www.youtube.com/watch?v=1jQjYuOeg4M', title: 'How to turn on the PS5 & sign in'},
    sauna:     {url: 'https://drive.google.com/file/d/1jlfz6IULLoH9LtIhFn19FSkOprVu3BW4/view', title: 'How to use the sauna'},
    golf:      {url: 'https://scanned.page/67aa367c633f2', title: 'How to use the golf simulator'},
    theater:   null,      // no video tutorial yet (text SOP only)
    game_room: null,      // no video tutorial yet (PDF only)
  };
  function videoBtn(key) {
    const v = AMENITY_VIDEOS[key];
    if (!v || !v.url) return '';
    const url = String(v.url).replace('/embed/', '/watch?v=');
    return `<a class="video-btn" href="${esc(url)}" target="_blank" rel="noopener">▶︎ ${esc(v.title || 'Watch the video')}</a>`;
  }

  function hotTubDetail(ht) {
    if (!ht || typeof ht !== 'object') return '';
    let h = '';
    const brand = (ht.brand && !/^hot tub$/i.test(ht.brand)) ? ht.brand : '';
    if (brand || ht.temp_range) h += `<div class="inst-note">${brand ? '<strong>' + esc(brand) + '</strong>' : 'Hot tub'}${ht.temp_range ? ' · set ' + esc(ht.temp_range) : ''}</div>`;
    const ms = ht.mode_setup || {};
    if (ms.must_do_first) h += `<div class="inst-note warn">⚠️ <strong>Do this first:</strong> ${esc(ms.must_do_first)}</div>`;
    if (ms.video_tutorial) {
      const vurl = String(ms.video_tutorial).replace('/embed/', '/watch?v=');
      h += `<a class="video-btn" href="${esc(vurl)}" target="_blank" rel="noopener">▶︎ ${esc(ms.video_tutorial_title || 'Watch the hot tub video')}</a>`;
    }
    if (Array.isArray(ht.quick_start) && ht.quick_start.length) h += `<div class="inst-h">Start it up</div><ol class="inst-steps">${ht.quick_start.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`;
    if (Array.isArray(ms.steps) && ms.steps.length) {
      h += `<div class="inst-h">🌡️ Not staying hot? Set the mode</div>`;
      if (ms.why) h += `<div class="inst-note">${esc(ms.why)}</div>`;
      h += `<ol class="inst-steps">${ms.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`;
    }
    if (Array.isArray(ht.rules) && ht.rules.length) h += `<div class="inst-h">♨️ Hot tub rules</div><ul class="inst-list">${ht.rules.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`;
    h += `<div class="inst-h">🔧 Still not heating?</div><ol class="inst-steps">`
       + `<li>Check the panel reads <strong>ST</strong> (Standard), not EC/Economy.</li>`
       + `<li>Check the water level, it must cover the filter, or the heater shuts off.</li>`
       + `<li>Top up with the garden hose to ~2 inches above the filter.</li>`
       + `<li>Give it 15 minutes, then re-check.</li>`
       + `<li>Still cold? Text us a photo of the control panel and we'll walk you through it.</li></ol>`;
    if (ht.shock_location || ht.water_care) h += `<div class="inst-note">${ht.shock_location ? '<strong>Shock:</strong> ' + esc(ht.shock_location) + '. ' : ''}${ht.water_care ? esc(ht.water_care) : ''}</div>`;
    if (ht.access_note) h += `<div class="inst-note">🚶 ${esc(ht.access_note)}</div>`;
    if (Array.isArray(ht.access_photos) && ht.access_photos.length) h += `<div class="access-strip">${ht.access_photos.map(u => `<img src="${esc(u)}" loading="lazy" alt="">`).join('')}</div>`;
    return h;
  }
  function saunaDetail() {
    return videoBtn('sauna') + `<div class="inst-note">Shower before use. Keep sessions to about 30 minutes.</div>`
      + `<div class="inst-h">How to run it</div>`
      + `<ol class="inst-steps"><li>Press <strong>POWER</strong> on the control panel.</li>`
      + `<li>Set the temperature with the <strong>+ / –</strong> buttons.</li>`
      + `<li>Set the timer, the heater auto-shuts off when it ends.</li>`
      + `<li>Keep water off the heater rocks. Sit back and enjoy.</li></ol>`;
  }
  function ps5Detail() {
    return videoBtn('ps5') + `<div class="inst-note warn">⚠️ <strong>Use the Guest Account only.</strong> Signing in with your personal PSN account can lock the console for the next guest, and lock you out mid-game.</div>`
      + `<div class="inst-h">Get playing</div>`
      + `<ol class="inst-steps"><li>Press and <strong>hold the PS button</strong> on the controller until it powers on.</li>`
      + `<li>Select the <strong>Guest Account</strong> already loaded on the console.</li>`
      + `<li>Open any game, they're all pre-downloaded through PS Plus.</li>`
      + `<li>Controller dying? Plug it into the console with the USB cable; it plays while charging.</li></ol>`
      + `<div class="inst-h">Second player</div>`
      + `<ol class="inst-steps"><li>Press the PS button on the second controller.</li>`
      + `<li>When it asks, choose <strong>log in as guest</strong> to pair it.</li></ol>`
      + `<div class="inst-note"><strong>No disc slot.</strong> The PS5 is mounted and has no disc tray, so stick with the downloaded PS Plus library.</div>`
      + `<div class="inst-note">Before checkout, please <strong>sign out of anything you signed into</strong> and put the controllers back on the charger.</div>`;
  }
  function theaterDetail(tr) {
    const pop = tr && tr.popcorn_machine && Array.isArray(tr.popcorn_machine.steps) ? tr.popcorn_machine.steps : null;

  // Make the browse-y sections collapsible, tap the heading to open/close. Start collapsed.
  function makeCollapsible(section, startCollapsed) {
    if (!section || section.classList.contains('collapsible')) return;
    const h2 = section.querySelector('h2');
    if (!h2) return;
    const body = document.createElement('div');
    body.className = 'sec-collapse';
    let n = h2.nextSibling;
    while (n) { const nx = n.nextSibling; body.appendChild(n); n = nx; }
    section.appendChild(body);
    section.classList.add('collapsible');
    if (startCollapsed) section.classList.add('collapsed');

  // Consolidate Host Picks / Getting Around / What's Nearest / Emergency into ONE section:
  // a CTA-style 2×2 tile grid where tapping a tile reveals that content below the grid.
  const HUB_SPEC = [

    const grid = hub.querySelector('.hub-grid');

    hubEntries.forEach(h => {
      const content = document.createElement('div');
      content.className = 'hub-content';
      content.style.display = 'none';
      const h2 = h.sec.querySelector('h2');
      let n = h2 ? h2.nextSibling : h.sec.firstChild;

    let idn = 0;
    const tabs = [];
    TAB_SPEC.forEach(spec => {
      const sec = secs.find(s => {
        if (s.style.display === 'none') return false;
        const h = s.querySelector('h2');
        return h && h.textContent.trim().startsWith(spec.match);

      if (!sec) return;
      if (!sec.id) sec.id = `sec-${++idn}`;
      const btn = document.createElement('button');

        const target = document.getElementById(sec.id);
        target.classList.remove('collapsed');  // open it if it's a collapsible section
        target.scrollIntoView({behavior: 'smooth', block: 'start'});
      });
      tabNav.appendChild(btn);
      tabs.push({btn, sec});
    });
    if (!tabs.length) {
      const w = tabNav.closest('.tab-nav-wrap');
      (w || tabNav).style.display = 'none';
    } else {
      const byId = new Map(tabs.map(t => [t.sec.id, t.btn]));
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (!e.isIntersecting) return;
          tabs.forEach(t => t.btn.classList.remove('active'));
          const b = byId.get(e.target.id);
          if (b) { b.classList.add('active'); b.scrollIntoView({inline: 'center', block: 'nearest', behavior: 'smooth'}); }
        });
      }, {rootMargin: '-45% 0px -50% 0px', threshold: 0});
      tabs.forEach(t => obs.observe(t.sec));

      // Arrows to reach tabs sitting off-screen (the bar scrolls horizontally)
      const tnWrap = tabNav.closest('.tab-nav-wrap');
      const aLeft = tnWrap && tnWrap.querySelector('#tabArrowLeft');
      const aRight = tnWrap && tnWrap.querySelector('#tabArrowRight');
      if (tnWrap && aLeft && aRight) {
        const upd = () => {
          const max = tabNav.scrollWidth - tabNav.clientWidth;
          const x = tabNav.scrollLeft;
          const overflow = max > 6;
          aLeft.hidden = !(overflow && x > 6);
          aRight.hidden = !(overflow && x < max - 6);
          tnWrap.classList.toggle('more-left', overflow && x > 6);
          tnWrap.classList.toggle('more-right', overflow && x < max - 6);
        };
        const step = () => Math.max(120, tabNav.clientWidth * 0.7);
        aRight.addEventListener('click', () => tabNav.scrollBy({left: step(), behavior: 'smooth'}));
        aLeft.addEventListener('click', () => tabNav.scrollBy({left: -step(), behavior: 'smooth'}));
        tabNav.addEventListener('scroll', upd, {passive: true});
        window.addEventListener('resize', upd);
        upd();
        setTimeout(upd, 80);
      }
    }

    };
    const ico = (n) => `<span class="kk-icon">${I[n] || ''}</span>`;

    function copyBtn(text, label) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'copy-btn';
      b.innerHTML = I.copy + (label ? `<span>${label}</span>` : '');
      b.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        const restore = b.innerHTML;
        const done = () => {
          b.classList.add('copied');
          b.innerHTML = I.check + '<span>Copied</span>';
          setTimeout(() => { b.classList.remove('copied'); b.innerHTML = restore; }, 1500);
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(done, done);
        } else {
          const ta = document.createElement('textarea'); ta.value = text;
          document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (_) {}
          ta.remove(); done();
        }
      });
      return b;
    }

    // 1. Reorder: Door Code + WiFi directly under the intro (above the welcome note)
    const welcome = app.querySelector('.welcome');
    const doorCard = app.querySelector('.door-code-card');
    const wifiSec = Array.from(app.querySelectorAll('section')).find(s => {
      const h = s.querySelector('h2'); return h && h.textContent.trim().startsWith('WiFi');
    });
    if (welcome && doorCard) welcome.parentNode.insertBefore(doorCard, welcome);
    if (doorCard && wifiSec) doorCard.parentNode.insertBefore(wifiSec, doorCard.nextSibling);

    // 1. Door code — keyhole icon, heavy code, copy button (only when it's a real code)
    const dcH2 = app.querySelector('.door-code-card h2');
    if (dcH2 && !dcH2.querySelector('.kk-icon')) dcH2.insertAdjacentHTML('afterbegin', ico('key'));
    const dcVal = app.querySelector('.door-code-value');
    if (dcVal) {
      const txt = (dcVal.textContent || '').trim();
      const isCode = /^\d{3,8}$/.test(txt);
      dcVal.classList.toggle('is-msg', !isCode);
      if (isCode) {
        const row = document.createElement('div');
        row.className = 'door-code-copy-row';
        row.appendChild(copyBtn(txt, 'Copy code'));
        dcVal.after(row);
      }
    }

    // 1. WiFi — signal icon + copy the password
    const wifiIc = app.querySelector('.wifi-ic');
    if (wifiIc) wifiIc.innerHTML = I.wifi;
    const wifiVals = app.querySelectorAll('.wifi-card .wifi-val');
    if (wifiVals.length >= 2) {
      const pw = wifiVals[1];
      const pwText = (pw.textContent || '').trim();
      const row = document.createElement('span');
      row.className = 'wifi-val-row';
      pw.parentNode.insertBefore(row, pw);
      row.appendChild(pw);
      row.appendChild(copyBtn(pwText, ''));
    }

    // CTA tiles + support lines → line icons
    const CTA_ICON = [['Text Us', 'msg'], ['Call Us', 'phone'], ['Early/Late', 'clock'], ['Report an Issue', 'alert']];
    app.querySelectorAll('.cta-grid .cta').forEach(c => {
      const lbl = ((c.querySelector('.label') || {}).textContent || '');
      const ic = c.querySelector('.icon');
      const hit = CTA_ICON.find(([k]) => lbl.indexOf(k) >= 0);
      if (ic && hit) ic.innerHTML = I[hit[1]];
    });

    // 4. Support "Need Anything?" — swap icons AND drop the Book-Direct line
    app.querySelectorAll('.help-line').forEach(h => {
      const main = ((h.querySelector('.h-main') || {}).textContent || '');
      if (/book direct/i.test(main)) { h.remove(); return; }
      const ic = h.querySelector('.h-ic');
      if (ic) ic.innerHTML = /report/i.test(main) ? I.alert : I.phone;
    });

    // 3. House-rule badges are applied in palaceReskin() below, so they survive ES/EN toggles.

    // 2. Tutorials → horizontal carousel (CSS drives layout; add a swipe hint)
    const vsec = Array.from(app.querySelectorAll('section')).find(s => {
      const h = s.querySelector('h2'); return h && h.textContent.trim().startsWith('Tutorials');
    });
    if (vsec && !vsec.querySelector('.vid-hint')) {
      const h2 = vsec.querySelector('h2');
      if (h2) h2.insertAdjacentHTML('afterend', '<div class="vid-hint">Swipe to browse →</div>');
    }
    // Palace: the shared "Drain the sink" tutorial pointed at a private Drive folder (dead link
    // for guests). Swap in the real public YouTube short + its thumbnail. Palace only for now.
    const SINK_YT = '7_NgcBi4qHc';
    app.querySelectorAll('.vid-list .vid-card').forEach(card => {
      if (!/drain the sink/i.test(((card.querySelector('.vid-title') || {}).textContent || ''))) return;
      card.setAttribute('href', `https://www.youtube.com/shorts/${SINK_YT}`);
      const thumb = card.querySelector('.vid-thumb');
      if (thumb) {
        thumb.style.backgroundImage = `url('https://img.youtube.com/vi/${SINK_YT}/hqdefault.jpg')`;
        const em = thumb.querySelector('.vid-emoji');
        if (em) em.remove();
      }
    });

    // 2. Photos → compact preview banner that opens a full-screen swipeable gallery on tap
    const strip = app.querySelector('.photo-strip');
    if (strip && strip.querySelectorAll('img').length) {
      const imgEls = Array.from(strip.querySelectorAll('img'));
      const urls = imgEls.map(im => im.getAttribute('src') || im.src);
      const first = imgEls[0];
      const n = urls.length;
      strip.innerHTML = '';
      strip.classList.add('pv2-banner');
      strip.appendChild(first);
      const count = document.createElement('span');
      count.className = 'pv2-count';
      count.innerHTML = I.image + `<span class="pv2-count-lbl">View all ${n} photo${n > 1 ? 's' : ''}</span>`;
      strip.appendChild(count);

      // Full-screen lightbox with every photo (horizontal swipe + arrows + counter)
      const lb = document.createElement('div');
      lb.className = 'pv2-lightbox';
      lb.innerHTML =
        `<button class="pv2-lb-close" type="button" aria-label="Close gallery">${I.x}</button>` +
        `<div class="pv2-lb-count"></div>` +
        `<button class="pv2-lb-nav pv2-lb-prev" type="button" aria-label="Previous">${I.chevL}</button>` +
        `<div class="pv2-lb-track">${urls.map(u => `<div class="pv2-lb-slide"><img src="${u}" loading="lazy" alt=""></div>`).join('')}</div>` +
        `<button class="pv2-lb-nav pv2-lb-next" type="button" aria-label="Next">${I.chevR}</button>`;
      document.body.appendChild(lb);
      const track = lb.querySelector('.pv2-lb-track');
      const counter = lb.querySelector('.pv2-lb-count');
      const idx = () => Math.round(track.scrollLeft / track.clientWidth);
      const sync = () => { counter.textContent = `${Math.min(idx() + 1, n)} / ${n}`; };
      track.addEventListener('scroll', sync, { passive: true });
      const go = (d) => track.scrollTo({ left: (idx() + d) * track.clientWidth, behavior: 'smooth' });
      lb.querySelector('.pv2-lb-next').addEventListener('click', () => go(1));
      lb.querySelector('.pv2-lb-prev').addEventListener('click', () => go(-1));
      const open = () => { lb.classList.add('open'); document.body.style.overflow = 'hidden'; track.scrollLeft = 0; sync(); };
      const close = () => { lb.classList.remove('open'); document.body.style.overflow = ''; };
      strip.addEventListener('click', open);
      lb.querySelector('.pv2-lb-close').addEventListener('click', close);
      lb.addEventListener('click', e => { if (e.target === lb) close(); });
      document.addEventListener('keydown', e => {
        if (!lb.classList.contains('open')) return;
        if (e.key === 'Escape') close();
        else if (e.key === 'ArrowRight') go(1);
        else if (e.key === 'ArrowLeft') go(-1);
      });
    }

    const setIco = (el, n) => { if (el) el.innerHTML = I[n] || ''; };
    const bt = app.querySelectorAll('.basics-times .btime .bt-ic');

    app.querySelectorAll('.cann-row').forEach(row => {

    const CO_ICON = [[/towel|rag/, 'shirt'], [/light/, 'bulb'], [/dish/, 'utensils'], [/trash/, 'trash'], [/remote|tv/, 'tv'], [/food|counter/, 'box'], [/bed/, 'bed']];

      if (hit) setIco(it.querySelector('.co-ic'), hit[1]);
    });
    const HUB_ICON = [[/host pick/i, 'dining'], [/getting around/i, 'car'], [/nearest/i, 'mappin'], [/emergenc/i, 'cross']];
    app.querySelectorAll('.hub-tile').forEach(t => {
      const lbl = ((t.querySelector('.label') || {}).textContent || '');
      const hit = HUB_ICON.find(([re]) => re.test(lbl));
      if (hit) setIco(t.querySelector('.icon'), hit[1]);

    // (refinement 1) Cannabis: uniform pills — turn the big orange "littering" block into a
    // clean "Allowed Outside" pill and move the detail into subtle subtext under the title.
    app.querySelectorAll('.cann-row').forEach(row => {
      const pill = row.querySelector('.cann-pill');
      const lbl = row.querySelector('.cann-lbl');
      if (!pill || !pill.classList.contains('warn')) return;
      pill.classList.remove('warn');

        const txt = document.createElement('span');
        txt.className = 'cann-txt';
        lbl.parentNode.insertBefore(txt, lbl);
        txt.appendChild(lbl);

        sub.className = 'cann-sub';
        sub.textContent = 'No littering, please';
        txt.appendChild(sub);
      }

    // (refinement 2 — reverted per Shaquan) Early/Late fees stay visible as the organized

    // (refinement 3) Quick Instructions: add a "tap to view" hint (the whole summary row is

    const amenSec = app.querySelector('[data-amenity-cards]');
    if (amenSec && !amenSec.querySelector('.amen-hint')) {

      if (h2) h2.insertAdjacentHTML('afterend', '<div class="amen-hint">Tap to view instructions</div>');

    // data-key and strip their emoji, so palaceReskin() can re-apply an SVG icon after any
    // toggle. Stripping the emoji also lets the plain name hit the ES dictionary cleanly.
    const AM_ICON = [[/hot tub|jacuzzi/i, 'waves'], [/sauna/i, 'flame'], [/ps5/i, 'gamepad'], [/theater|cine/i, 'film'], [/golf/i, 'flag'], [/game room|juegos/i, 'dice']];
    app.querySelectorAll('.amenity-acc > details > summary').forEach(s => {
      const name = (s.textContent || '').trim().replace(/^\S+\s+/, '');
      const hit = AM_ICON.find(([re]) => re.test(name));
      if (hit) { s.dataset.pico = hit[1]; s.textContent = name; }
    });
    const PILL_ICON = [[/access/i, 'key'], [/wifi/i, 'wifi'], [/rules/i, 'scroll'], [/basics/i, 'clipboard'], [/early/i, 'clock'], [/checkout/i, 'door'], [/amenities/i, 'gamepad'], [/explore/i, 'map'], [/help/i, 'help']];
    app.querySelectorAll('.tab-nav .tab-btn').forEach(btn => {
      const name = (btn.textContent || '').trim().replace(/^\S+\s+/, '');
      const hit = PILL_ICON.find(([re]) => re.test(name));
      if (hit) { btn.dataset.pico = hit[1]; btn.textContent = name; }
    });

    // Re-runnable reskin: (b) rule badges + the clobberable icons. Runs once now and again
    // after every language switch (via __afterSetLang), so nothing is permanently lost.
    function palaceReskin() {
      app.querySelectorAll('.rule .r-body').forEach(b => {
        if (!b.querySelector('.fine-badge')) {
          b.innerHTML = b.innerHTML.replace(/\$[\d,]+/g, m => `<span class="fine-badge">${m}</span>`);
        }

        if (!s.querySelector('.kk-icon')) s.insertAdjacentHTML('afterbegin', ico(s.dataset.pico));
      });
      app.querySelectorAll('.tab-nav .tab-btn[data-pico]').forEach(btn => {
        if (!btn.querySelector('.kk-icon')) btn.insertAdjacentHTML('afterbegin', ico(btn.dataset.pico));
      });
    }
    window.__afterSetLang = palaceReskin;
    palaceReskin();
  }

  function setLang(lang) {
    localStorage.setItem('kk_lang', lang);
    document.documentElement.lang = lang;
    document.querySelectorAll('h2, .prop-tag, .tagline-lead, .tagline-sub, .label, .sub, .k, .v, .checkout-list li, .co-txt, .door-code-cta, .door-code-value, .amenity-card .title-row span:last-child, .amenity-card .body, .nearest-row .cat, .full-guide-link, p, .door-code-card h2, .t-name, .t-sub, section .inst-note, .welcome, .picks-intro, .tab-btn, .r-title, .r-body, .help-line .h-main, .help-line .h-sub, .sb-title, .sb-sub, .amenity-acc summary, .vid-title, .vid-chan, .fee-title, .fee-note, .fee-item span, .wifi-k, .bt-lbl, .bi-k, .cann-lbl, .cann-pill, .cann-sub, .amen-hint, .vid-hint, .fee-accordion summary').forEach(el => {
      if (lang === 'es') {
        if (!el.dataset.en) el.dataset.en = el.textContent.trim();
        const t = ES[el.dataset.en];
        if (t) el.textContent = t;
      } else {
        if (el.dataset.en) el.textContent = el.dataset.en;
      }
    });
    const btn = document.getElementById('langToggle');
    if (btn) btn.textContent = lang === 'es' ? 'ES | EN' : 'EN | ES';
    // Palace v2: re-apply icons/badges that this text swap wiped out.
    if (window.__afterSetLang) { try { window.__afterSetLang(lang); } catch (_) {} }
  }

  const savedLang = localStorage.getItem('kk_lang') || 'en';
  if (savedLang === 'es') setLang('es');
  document.getElementById('langToggle').addEventListener('click', () => {
    setLang(document.documentElement.lang === 'es' ? 'en' : 'es');
  });
})();
